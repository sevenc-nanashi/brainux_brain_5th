[package]
name = "brainux-probe"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "brainux-probe"

[[bin]]
name = "brainux-probe"
path = "src/main.rs"

[[bin]]
name = "brainux-loader"
path = "src/loader.rs"

[dependencies]
reflex = { path = "../brain_5th_hack/crates/reflex", features = ["application", "panic-screen"] }
fdt = "0.1.5"
sha2 = { version = "0.10", default-features = false }

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
codegen-units = 1

[features]
host = []

[[bin]]
name = "bundle-check"
path = "src/bundle_check.rs"
required-features = ["host"]
